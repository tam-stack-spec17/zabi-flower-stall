<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zabi Flower Stall</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 text-gray-800">
    <header class="bg-pink-600 text-white text-center py-10">
        <h1 class="text-4xl font-bold">Zabi Flower Stall</h1>
        <p class="mt-2 text-xl">Fresh Flowers for Every Occasion</p>
    </header>
    <main class="max-w-4xl mx-auto p-6 mt-8 bg-white rounded-lg shadow-md">
        <h2 class="text-2xl font-semibold mb-4 text-pink-600">Our Services</h2>
        <ul class="list-disc pl-6 space-y-2 text-lg">
            <li>Fresh Bouquets</li>
            <li>Wedding Decorations</li>
            <li>Event Floral Arrangements</li>
            <li>Custom Flower Baskets</li>
        </ul>
        <div class="mt-8 text-center">
            <a href="https://maps.app.goo.gl/8B9KbWLMzG3U3pp5A" target="_blank" class="bg-pink-600 text-white px-6 py-3 rounded-full font-bold hover:bg-pink-700 transition">Visit Our Store</a>
        </div>
    </main>
</body>
</html>
