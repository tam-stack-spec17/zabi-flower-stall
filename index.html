<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zabi Flower Stall</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-gray-800 min-h-screen relative">
    
    <!-- Looping Video Background -->
    <div class="fixed inset-0 z-[-1] overflow-hidden">
        <video autoplay loop muted playsinline class="absolute min-w-full min-h-full object-cover top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
            <source src="shop-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="absolute inset-0 bg-black/40"></div>
    </div>

    <!-- Main Content Box -->
    <div class="relative z-10 p-6 flex flex-col items-center justify-center min-h-screen">
        <header class="bg-pink-600/90 backdrop-blur-sm text-white text-center py-10 px-8 w-full max-w-4xl rounded-t-lg shadow-md">
            <h1 class="text-5xl font-bold">Zabi Flower Stall</h1>
            <p class="mt-3 text-2xl">Fresh Flowers for Every Occasion</p>
        </header>
        
        <main class="w-full max-w-4xl p-8 bg-white/90 backdrop-blur-md rounded-b-lg shadow-2xl">
            <h2 class="text-3xl font-semibold mb-6 text-pink-600 text-center">Our Services</h2>
            <div class="flex justify-center">
                <ul class="list-disc pl-6 space-y-3 text-xl font-medium">
                    <li>Fresh Bouquets & Arrangements</li>
                    <li>Wedding & Event Decorations</li>
                    <li>Custom Flower Baskets</li>
                    <li>Daily Fresh Deliveries</li>
                </ul>
            </div>

            <!-- Business Hours Section -->
            <div class="mt-10 border-t border-gray-300 pt-8">
                <h2 class="text-3xl font-semibold mb-6 text-pink-600 text-center">Business Hours</h2>
                <div class="max-w-md mx-auto bg-pink-50/50 p-6 rounded-xl shadow-inner border border-pink-100">
                    <div class="flex justify-between py-3 border-b border-pink-200 text-lg">
                        <span class="font-bold text-gray-700">Monday - Saturday</span>
                        <span class="text-gray-600">8:00 AM - 9:00 PM</span>
                    </div>
                    <div class="flex justify-between py-3 text-lg">
                        <span class="font-bold text-gray-700">Sunday</span>
                        <span class="text-pink-600 font-bold">8:00 AM - 2:00 PM</span>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-10 flex flex-col sm:flex-row justify-center items-center gap-4">
                <a href="https://maps.app.goo.gl/8B9KbWLMzG3U3pp5A" target="_blank" class="inline-block w-full sm:w-auto text-center bg-pink-600 text-white px-8 py-4 rounded-full text-xl font-bold hover:bg-pink-700 transition transform hover:scale-105 shadow-lg">
                    📍 Visit Our Store
                </a>
                
                <a href="https://wa.me/919343458734?text=Hello%20Zabi%20Flower%20Stall!%20I%20would%20like%20to%20order%20some%20flowers." target="_blank" class="inline-block w-full sm:w-auto text-center bg-green-500 text-white px-8 py-4 rounded-full text-xl font-bold hover:bg-green-600 transition transform hover:scale-105 shadow-lg">
                    💬 WhatsApp Us
                </a>
            </div>

            <!-- Social Media Links -->
            <div class="mt-10 pt-6 border-t border-gray-200 flex justify-center gap-6">
                <!-- Instagram -->
                <a href="https://www.instagram.com/zabiflowerdecoration/" target="_blank" class="text-pink-600 hover:text-pink-700 transition transform hover:scale-110 shadow-sm rounded-full bg-pink-50 p-3">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">

                    </svg>
                </a>
                
                <!-- Facebook -->
                <a href="https://www.facebook.com/syed.zabi.980315/" target="_blank" class="text-pink-600 hover:text-pink-700 transition transform hover:scale-110 shadow-sm rounded-full bg-pink-50 p-3">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill-rule="evenodd" d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" clip-rule="evenodd" />

            </div>
        </main>
    </div>

</html>
