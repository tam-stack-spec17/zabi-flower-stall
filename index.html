<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zabi Flower Stall</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-gray-800 min-h-screen relative">
    
    <!-- Looping Video Background -->
        <div class="fixed inset-0 z-[-1] overflow-hidden">
            <video autoplay loop muted playsinline class="absolute min-w-full min-h-full object-cover top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                <source src="shop-video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <!-- Dark overlay so text remains readable -->
            <div class="absolute inset-0 bg-black/40"></div>
        </div>

    <!-- Main Content Box -->
    <div class="relative z-10 p-6 flex flex-col items-center justify-center min-h-screen">
        <header class="bg-pink-600/90 backdrop-blur-sm text-white text-center py-10 px-8 w-full max-w-4xl rounded-t-lg shadow-md">
            <h1 class="text-5xl font-bold">Zabi Flower Stall</h1>
            <p class="mt-3 text-2xl">Fresh Flowers for Every Occasion</p>
        </header>
        
        <main class="w-full max-w-4xl p-8 bg-white/90 backdrop-blur-md rounded-b-lg shadow-2xl">
            <h2 class="text-3xl font-semibold mb-6 text-pink-600 text-center">Our Services</h2>
            <div class="flex justify-center">
                <ul class="list-disc pl-6 space-y-3 text-xl font-medium">
                    <li>Fresh Bouquets & Arrangements</li>
                    <li>Wedding & Event Decorations</li>
                    <li>Custom Flower Baskets</li>
                    <li>Daily Fresh Deliveries</li>
                </ul>
            </div>
            <div class="mt-10 text-center">
                <a href="https://maps.app.goo.gl/8B9KbWLMzG3U3pp5A" target="_blank" class="inline-block bg-pink-600 text-white px-8 py-4 rounded-full text-xl font-bold hover:bg-pink-700 transition transform hover:scale-105 shadow-lg">
                    📍 Visit Our Store
                </a>
            </div>
        </main>
    </div>

</body>
</html>
